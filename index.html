<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>中華基督教會全完第一小學 - 中秋猜燈謎</title>
  <style>
    :root {
      --primary-gold: #ffc107;
      --board-bg: #fffbeb;
      --text-brown: #4a2810;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Comic Sans MS", "Microsoft JhengHei", "微軟正黑體", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #090723;
    }

    .game-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: radial-gradient(circle at 18% 18%, #311068 0%, #1e1b4b 35%, #0f172a 75%, #020617 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(1.2vh, env(safe-area-inset-top)) max(2.5vw, env(safe-area-inset-right)) max(1.2vh, env(safe-area-inset-bottom)) max(2.5vw, env(safe-area-inset-left));
      border: 5px solid #f59e0b;
      overflow: hidden;
    }

    /* ================= 中秋動態背景 ================= */
    .moon {
      position: absolute;
      top: 3vh;
      left: 6vw;
      width: 12vh;
      height: 12vh;
      background: radial-gradient(circle, #ffffff 15%, #fef08a 60%, #eab308 100%);
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(254, 240, 138, 0.9), 0 0 70px rgba(234, 179, 8, 0.5);
      z-index: 1;
      pointer-events: none;
      animation: moonPulse 4s infinite alternate ease-in-out;
    }

    @keyframes moonPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 20px #fde047); }
    }

    .cloud {
      position: absolute;
      background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.18), rgba(255,255,255,0.02));
      border-radius: 50px;
      filter: blur(8px);
      z-index: 2;
      pointer-events: none;
    }
    .cloud-1 { width: 280px; height: 50px; top: 8vh; animation: floatCloud 28s infinite linear; }
    .cloud-2 { width: 380px; height: 60px; top: 30vh; animation: floatCloud 40s infinite linear -12s; }

    @keyframes floatCloud {
      from { transform: translateX(-400px); }
      to { transform: translateX(110vw); }
    }

    .sky-item {
      position: absolute;
      bottom: -60px;
      z-index: 2;
      pointer-events: none;
      animation: flyUpward linear infinite;
    }
    .item-lantern-1 { left: 14vw; font-size: 26px; animation-duration: 15s; }
    .item-mooncake-1 { left: 82vw; font-size: 24px; animation-duration: 18s; animation-delay: 4s; }

    @keyframes flyUpward {
      0% { transform: translateY(0) rotate(-4deg); opacity: 0; }
      15% { opacity: 0.9; }
      50% { transform: translateY(-50vh) rotate(5deg); }
      85% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(-4deg); opacity: 0; }
    }

    .twinkle-star {
      position: absolute;
      font-size: 16px;
      z-index: 1;
      pointer-events: none;
      animation: starTwinkle 2.5s infinite ease-in-out alternate;
    }
    .star-1 { top: 7vh; left: 28vw; }
    .star-2 { top: 16vh; left: 75vw; font-size: 20px; animation-delay: 1.1s; }

    @keyframes starTwinkle {
      0% { transform: scale(0.6); opacity: 0.3; }
      100% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 6px #fde047); }
    }

    .hanging-ornament {
      position: absolute;
      top: -5px;
      left: 1.5vw;
      z-index: 4;
      pointer-events: none;
      transform-origin: top center;
      animation: swingOrnament 3.4s infinite ease-in-out alternate;
      line-height: 1.1;
      text-align: center;
    }

    @keyframes swingOrnament {
      0% { transform: rotate(-7deg); }
      100% { transform: rotate(7deg); }
    }

    .decor-left {
      position: absolute;
      left: 1vw;
      top: 16vh;
      z-index: 3;
      pointer-events: none;
      text-align: center;
      animation: floatChangE 4s infinite ease-in-out alternate;
    }
    @keyframes floatChangE {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    .decor-right {
      position: absolute;
      right: 1vw;
      bottom: 6vh;
      z-index: 3;
      pointer-events: none;
      text-align: center;
    }

    /* ================= 頂部標頭與校名 Logo 區域 ================= */
    .top-bar-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
      margin-top: 0.5vh;
    }

    .school-logo-transparent {
      position: absolute;
      top: 0;
      right: 1vw;
      z-index: 10;
      display: flex;
      align-items: center;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.95)) 
              drop-shadow(0 0 8px rgba(255, 255, 255, 0.45));
    }

    .school-logo-img {
      height: 5vh;
      max-height: 44px;
      min-height: 24px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .game-main-title {
      font-size: clamp(24px, 4.2vh, 38px);
      font-weight: 900;
      color: #fff9c4;
      text-shadow: 0 3px 0 #78350f, 0 5px 12px rgba(0,0,0,0.7);
      letter-spacing: 1.5px;
      white-space: nowrap;
      text-align: center;
    }

    /* 分數牌（左右皆為金色小星星） */
    .round-score-bar {
      background: linear-gradient(180deg, #ca8a04 0%, #854d0e 100%);
      border: 2px solid #fef08a;
      border-radius: 40px;
      padding: 0.5vh 3.5vw;
      color: #ffffff;
      font-size: clamp(16px, 2.5vh, 22px);
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      margin: 0.5vh 0;
    }

    .score-star {
      font-size: 1.1em;
      filter: drop-shadow(0 0 4px rgba(254, 240, 138, 0.8));
    }

    /* 中央燈謎板 */
    .board-container {
      position: relative;
      width: 78vw;
      max-width: 680px;
      min-height: 28vh;
      background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%);
      border: 5px solid #f59e0b;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vh 3vw;
      z-index: 6;
      margin: 0.5vh 0;
    }

    .board-bunny {
      position: absolute;
      font-size: clamp(24px, 3.8vh, 32px);
    }
    .bunny-tl { top: -1.8vh; left: -1vw; }
    .bunny-tr { top: -1.8vh; right: -1vw; }
    .bunny-bl { bottom: -1.5vh; left: -1vw; }
    .bunny-br { bottom: -1.5vh; right: -1vw; }

    .riddle-number {
      font-size: clamp(16px, 2.4vh, 22px);
      font-weight: 900;
      color: #b45309;
      margin-bottom: 0.5vh;
      white-space: nowrap;
    }

    .riddle-question-text {
      font-size: clamp(20px, 3.3vh, 30px);
      line-height: 1.45;
      font-weight: 900;
      color: var(--text-brown);
      text-align: center;
    }

    .feedback-msg {
      font-size: clamp(16px, 2.5vh, 22px);
      font-weight: 900;
      min-height: 3.2vh;
      z-index: 6;
      white-space: nowrap;
    }
    .feedback-msg.correct { color: #4ade80; }
    .feedback-msg.wrong { color: #f87171; }

    /* 彩色按鈕 */
    .candy-btn-group {
      display: flex;
      justify-content: center;
      gap: 1.8vw;
      width: 90vw;
      max-width: 820px;
      z-index: 6;
      margin-bottom: 0.8vh;
    }

    .btn-candy {
      flex: 1;
      padding: 1.4vh 1vw;
      font-size: clamp(18px, 3vh, 28px);
      font-weight: 900;
      color: #ffffff;
      border: 3.5px solid #ffffff;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,0.35);
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      outline: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-candy:nth-child(1) { background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%); }
    .btn-candy:nth-child(2) { background: linear-gradient(180deg, #f472b6 0%, #db2777 100%); }
    .btn-candy:nth-child(3) { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); }
    .btn-candy:nth-child(4) { background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%); }

    .btn-candy:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.35);
    }

    /* 底部操作面板 */
    .control-footer {
      display: flex;
      gap: 2vw;
      z-index: 7;
      margin-bottom: 0.5vh;
    }

    .util-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid #ffd54f;
      color: #fff9c4;
      font-size: clamp(13px, 1.8vh, 16px);
      font-weight: 900;
      padding: 0.6vh 2.5vw;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
    }

    .view-page { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: space-between; }
    .view-page.active { display: flex; }

    /* iPhone / 直向螢幕特別優化 */
    @media (max-width: 600px), (orientation: portrait) {
      .top-bar-wrapper {
        flex-direction: column;
        gap: 0.3vh;
        margin-top: 0.2vh;
      }
      
      .school-logo-transparent {
        position: static;
        margin-bottom: 0.2vh;
      }

      .school-logo-img {
        height: 3.5vh;
        max-height: 28px;
      }

      .game-main-title {
        font-size: 24px;
      }

      .board-container {
        width: 88vw;
        min-height: 32vh;
        padding: 1.8vh 3.5vw;
      }

      .riddle-question-text {
        font-size: 21px;
        line-height: 1.45;
      }

      .candy-btn-group {
        width: 92vw;
        gap: 1.5vw;
      }

      .btn-candy {
        font-size: 20px;
        padding: 1.4vh 0.8vw;
        border-radius: 18px;
      }

      .decor-left {
        font-size: 6vh;
        left: -1vw;
        top: 22vh;
        opacity: 0.7;
      }

      .decor-right {
        font-size: 7vh;
        right: -1vw;
        bottom: 7vh;
        opacity: 0.7;
      }
    }
  </style>
</head>
<body>

  <div class="game-viewport">

    <!-- 動態背景 -->
    <div class="moon"></div>
    <div class="twinkle-star star-1">✨</div>
    <div class="twinkle-star star-2">⭐</div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="sky-item item-lantern-1">🏮</div>
    <div class="sky-item item-mooncake-1">🥮</div>

    <div class="hanging-ornament">
      <div style="font-size: 32px;">🏮</div>
      <div style="font-size: 20px; margin-top:-4px;">🍐</div>
    </div>

    <div class="decor-left">
      <div>🧚‍♀️</div>
      <div style="font-size: 0.5em; margin-top:-1vh;">☁️🐇</div>
    </div>

    <div class="decor-right">
      <div>🛖</div>
      <div style="font-size: 0.5em; margin-top:-1.5vh;">🐰🥮🐻</div>
    </div>

    <!-- 1. 主頁畫面 -->
    <div id="home-view" class="view-page active">
      <div class="top-bar-wrapper">
        <div class="school-logo-transparent">
          <img src="logo%202022.png" alt="中華基督教會全完第一小學" class="school-logo-img" onerror="handleImageFallback(this)">
        </div>
        <div class="game-main-title">🥮 中秋猜燈謎 🏮</div>
      </div>

      <div class="board-container" style="min-height: 38vh;">
        <div class="board-bunny bunny-tl">🐰</div>
        <div class="board-bunny bunny-tr">🐰</div>
        <div class="board-bunny bunny-bl">🐰</div>
        <div class="board-bunny bunny-br">🐰</div>
        
        <div style="font-size: clamp(18px, 3vh, 26px); font-weight: 900; color: var(--text-brown); line-height: 1.6; text-align:center;">
          🌕 歡迎各位小朋友！<br>
          每個回合有 <strong style="color:#d97706;">5 條題目</strong><br>
          答啱 1 題得 <strong style="color:#16a34a;">1 分</strong> ⭐
        </div>
      </div>

      <div class="candy-btn-group" style="width: auto;">
        <button class="btn-candy" style="background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); padding: 1.5vh 6vw;" onclick="startGame()">
          開始遊戲 🚀
        </button>
      </div>

      <div class="control-footer">
        <button class="util-btn" onclick="toggleFullScreen()">⛶ 全螢幕模式</button>
      </div>
    </div>

    <!-- 2. 猜燈謎遊戲畫面 -->
    <div id="quiz-view" class="view-page">
      <div class="top-bar-wrapper">
        <div class="school-logo-transparent">
          <img src="logo%202022.png" alt="中華基督教會全完第一小學" class="school-logo-img" onerror="handleImageFallback(this)">
        </div>
        <div class="game-main-title">中秋猜燈謎遊戲</div>
      </div>

      <!-- 分數牌：左邊與右邊均為星星圖案 ⭐ -->
      <div class="round-score-bar">
        <span class="score-star">⭐</span>
        <span>回合分數：<span id="score-display">0</span> / 5</span>
        <span class="score-star">⭐</span>
        <span>第 <span id="q-num-display">1</span> 題</span>
      </div>

      <div class="board-container">
        <div class="board-bunny bunny-tl">🐰</div>
        <div class="board-bunny bunny-tr">🐰</div>
        <div class="board-bunny bunny-bl">🐰</div>
        <div class="board-bunny bunny-br">🐰</div>

        <div class="riddle-number" id="riddle-tag">題目 1</div>
        <div class="riddle-question-text" id="question-text">題目載入中...</div>
      </div>

      <div class="feedback-msg" id="feedback-area"></div>

      <div class="candy-btn-group" id="options-group"></div>

      <div class="control-footer">
        <button class="util-btn" onclick="goHome()">🏠 主頁</button>
        <button class="util-btn" onclick="refreshQuestion()">🔄 更新題目</button>
        <button class="util-btn" onclick="toggleFullScreen()">⛶ 全螢幕</button>
      </div>
    </div>

    <!-- 3. 回合結算畫面 -->
    <div id="result-view" class="view-page">
      <div class="top-bar-wrapper">
        <div class="school-logo-transparent">
          <img src="logo%202022.png" alt="中華基督教會全完第一小學" class="school-logo-img" onerror="handleImageFallback(this)">
        </div>
        <div class="game-main-title">🎉 回合挑戰完成 🎉</div>
      </div>

      <div class="board-container" style="min-height: 34vh;">
        <div class="board-bunny bunny-tl">🐰</div>
        <div class="board-bunny bunny-tr">🐰</div>
        <div class="board-bunny bunny-bl">🐰</div>
        <div class="board-bunny bunny-br">🐰</div>

        <div style="font-size: clamp(16px, 2.5vh, 22px); color: var(--text-brown); font-weight: 900;">你的總得分是：</div>
        <div style="font-size: clamp(42px, 7vh, 60px); color: #dc2626; font-weight: 900; margin: 0.6vh 0;">
          <span id="final-score-text">0</span> / 5 分
        </div>
        <div id="final-comment-text" style="font-size: clamp(16px, 2.5vh, 22px); color: #15803d; font-weight: 900;"></div>
      </div>

      <div class="candy-btn-group" style="width: auto; max-width: 95vw; gap: 2vw;">
        <button class="btn-candy" style="background: linear-gradient(180deg, #22c55e 0%, #15803d 100%); padding: 1.5vh 4vw;" onclick="startGame()">
          下一位小朋友 🎮
        </button>
        <button class="btn-candy" style="background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); padding: 1.5vh 4vw;" onclick="goHome()">
          🏠 主頁
        </button>
      </div>

      <div class="control-footer">
        <button class="util-btn" onclick="toggleFullScreen()">⛶ 全螢幕</button>
      </div>
    </div>

  </div>

  <script>
    function handleImageFallback(img) {
      if (!img.dataset.triedWeb) {
        img.dataset.triedWeb = "true";
        img.src = "https://www.cccfy1.edu.hk/CustomFiles/school_logo.png";
      } else {
        img.parentElement.innerHTML = '<span style="color:#ffffff;font-weight:900;font-size:16px;letter-spacing:1px;text-shadow:0 0 8px rgba(255,255,255,0.6);">中華基督教會全完第一小學</span>';
      }
    }

    const questionBank = [
      {
        q: "圓圓臉龐白如雪，住在月亮好快樂。（猜一動物）",
        options: ["兔子", "小狗", "星星"],
        ans: "兔子"
      },
      {
        q: "有時似香蕉，有時似大圓盤，掛在夜空照大地。（猜自然事物）",
        options: ["月亮", "太陽", "彩虹"],
        ans: "月亮"
      },
      {
        q: "圓圓甜甜像餅乾，中秋全家一齊切開食。（猜節日食物）",
        options: ["月餅", "雪糕", "西瓜"],
        ans: "月餅"
      },
      {
        q: "手拿小竹棒，夜晚發光去散步，五顏六色好美麗。（猜節日用品）",
        options: ["燈籠", "雨傘", "氣球"],
        ans: "燈籠"
      },
      {
        q: "傳說中飛上月亮，住在月宮的美麗仙女。（猜人物）",
        options: ["嫦娥", "白雪公主", "灰姑娘"],
        ans: "嫦娥"
      },
      {
        q: "細細粒，點燃會發光，放在燈籠入面照亮路。（猜物品）",
        options: ["蠟燭", "雪條", "牙刷"],
        ans: "蠟燭"
      }
    ];

    let roundQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let isLocked = false;

    function shuffle(arr) {
      return arr.slice().sort(() => Math.random() - 0.5);
    }

    function switchPage(pageId) {
      document.querySelectorAll('.view-page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function startGame() {
      score = 0;
      currentIndex = 0;
      isLocked = false;
      roundQuestions = shuffle(questionBank).slice(0, 5);
      switchPage('quiz-view');
      renderQuestion();
    }

    function renderQuestion() {
      isLocked = false;
      const qData = roundQuestions[currentIndex];

      document.getElementById('q-num-display').innerText = currentIndex + 1;
      document.getElementById('score-display').innerText = score;
      document.getElementById('riddle-tag').innerText = `題目 ${currentIndex + 1}`;
      document.getElementById('question-text').innerText = qData.q;
      document.getElementById('feedback-area').innerText = '';

      const container = document.getElementById('options-group');
      container.innerHTML = '';

      const shuffledOpts = shuffle(qData.options);
      shuffledOpts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-candy';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(opt, qData.ans, btn);
        container.appendChild(btn);
      });
    }

    function handleAnswer(selected, correct, btnEl) {
      if (isLocked) return;
      isLocked = true;

      const fb = document.getElementById('feedback-area');

      if (selected === correct) {
        score += 1;
        document.getElementById('score-display').innerText = score;
        fb.innerText = '⭐ (正確) 答啱喇！好叻呀！ ⭐';
        fb.className = 'feedback-msg correct';
        btnEl.style.transform = 'scale(1.06)';
      } else {
        fb.innerText = `答錯咗少少，正確答案係【${correct}】`;
        fb.className = 'feedback-msg wrong';
        btnEl.style.opacity = '0.5';
      }

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < roundQuestions.length) {
          renderQuestion();
        } else {
          showResult();
        }
      }, 1400);
    }

    function refreshQuestion() {
      const unused = questionBank.filter(q => !roundQuestions.includes(q));
      if (unused.length > 0) {
        roundQuestions[currentIndex] = unused[Math.floor(Math.random() * unused.length)];
      } else {
        roundQuestions[currentIndex] = questionBank[Math.floor(Math.random() * questionBank.length)];
      }
      renderQuestion();
    }

    function showResult() {
      switchPage('result-view');
      document.getElementById('final-score-text').innerText = score;
      const commentEl = document.getElementById('final-comment-text');

      if (score === 5) {
        commentEl.innerText = '🌟 滿分！中秋猜謎小狀元！ 🌕';
      } else if (score >= 3) {
        commentEl.innerText = '👏 好厲害！表現非常出色！ 🥮';
      } else {
        commentEl.innerText = '💪 繼續加油！下次一定更勁！ 🏮';
      }
    }

    function goHome() {
      switchPage('home-view');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
